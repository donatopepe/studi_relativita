name: verify

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and structural tests
        run: python3 -m unittest discover -s tests -v
      - name: Deterministic source extraction
        run: python3 tools/extract_docx.py --check
      - name: Deterministic source inventory
        run: python3 tools/inventory_source.py --check
      - name: Deterministic constraint study
        run: python3 studies/free-fall-identifiability/analysis.py --check
      - name: Whitespace check
        run: git diff --check

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-lang-italian
      - name: Compile Italian paper
        working-directory: papers/foundation/it
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Compile English paper
        working-directory: papers/foundation/en
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Compile Paper II Italian
        working-directory: papers/classical-dynamics/it
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Compile Paper II English
        working-directory: papers/classical-dynamics/en
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Compile Paper II-B Italian appendix
        working-directory: papers/classical-dynamics/it
        run: |
          pdflatex -jobname=barrier-appendix-it -interaction=nonstopmode -halt-on-error barrier-appendix.tex
          bibtex barrier-appendix-it
          pdflatex -jobname=barrier-appendix-it -interaction=nonstopmode -halt-on-error barrier-appendix.tex
          pdflatex -jobname=barrier-appendix-it -interaction=nonstopmode -halt-on-error barrier-appendix.tex
      - name: Compile Paper II-B English appendix
        working-directory: papers/classical-dynamics/en
        run: |
          pdflatex -jobname=barrier-appendix-en -interaction=nonstopmode -halt-on-error barrier-appendix.tex
          bibtex barrier-appendix-en
          pdflatex -jobname=barrier-appendix-en -interaction=nonstopmode -halt-on-error barrier-appendix.tex
          pdflatex -jobname=barrier-appendix-en -interaction=nonstopmode -halt-on-error barrier-appendix.tex
      - name: Compile Paper II-A appendices
        run: |
          cd papers/classical-dynamics/it
          pdflatex -jobname=hard-constraint-appendix-it -interaction=nonstopmode -halt-on-error hard-constraint-appendix.tex
          cd ../en
          pdflatex -jobname=hard-constraint-appendix-en -interaction=nonstopmode -halt-on-error hard-constraint-appendix.tex
      - name: Compile spacetime foundations
        run: |
          cd papers/spacetime-foundations/it
          pdflatex -jobname=spacetime-foundations-it -interaction=nonstopmode -halt-on-error main.tex
          bibtex spacetime-foundations-it
          pdflatex -jobname=spacetime-foundations-it -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -jobname=spacetime-foundations-it -interaction=nonstopmode -halt-on-error main.tex
          cd ../en
          pdflatex -jobname=spacetime-foundations-en -interaction=nonstopmode -halt-on-error main.tex
          bibtex spacetime-foundations-en
          pdflatex -jobname=spacetime-foundations-en -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -jobname=spacetime-foundations-en -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: umch-paper-pdfs
          path: |
            papers/foundation/it/main.pdf
            papers/foundation/en/main.pdf
            papers/classical-dynamics/it/main.pdf
            papers/classical-dynamics/en/main.pdf
            papers/classical-dynamics/it/barrier-appendix-it.pdf
            papers/classical-dynamics/en/barrier-appendix-en.pdf
            papers/classical-dynamics/it/hard-constraint-appendix-it.pdf
            papers/classical-dynamics/en/hard-constraint-appendix-en.pdf
            papers/spacetime-foundations/it/spacetime-foundations-it.pdf
            papers/spacetime-foundations/en/spacetime-foundations-en.pdf
